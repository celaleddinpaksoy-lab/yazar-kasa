name: Release

# GITHUB_TOKEN varsayılanı salt-okunur; paket(ler) GitHub Releases'e
# yüklenebilsin diye contents yazma izni açık:
permissions:
  contents: write

# Etiket itildiğinde (v*) veya elle (workflow_dispatch) her platform için
# kurulum paketi üretilir ve GitHub Releases'e yüklenir.
# Electron her platformda kendi native modülünü derlediği için her OS kendi
# runner'ında ve mimarisinde build edilmelidir (çapraz derleme desteklenmez).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  mac-arm64:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build + publish
        run: npm run build:mac -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # NOT: macOS Intel (x64) job'u kaldırıldı — macos-13 runner'ı artık kullanılamıyor
  # (kuyrukta 30+ dk kalıyor). Intel paketi gerekirse Intel bir Mac'te 'npm run
  # build:mac' çalıştırılarak (o makinede native zincir tamam) üretilir.

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build + publish
        run: npm run build:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}