appId: com.yazarkasa.app
productName: YazarKasa
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asarUnpack:
  - resources/**
npmRebuild: true

# Otomatik güncelleme: GitHub Releases.
# owner/repo AÇIKÇA belirtilir — böylece "git origin'den çek" belirsizliği
# ortadan kalkar ve kurulu uygulamalar güncellemeyi her ortamda doğru repo'dan
# kontrol eder. Repo public: kurulu uygulamalar new sürümü token'sız indirir.
publish:
  provider: github
  owner: celaleddinpaksoy-lab
  repo: yazar-kasa

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
portable:
  artifactName: ${productName}-portable-${version}-${arch}.${ext}
mac:
  target:
    - dmg
    - zip
  category: public.app-category.business
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
  category: Office
  artifactName: ${productName}-${version}-${arch}.${ext}