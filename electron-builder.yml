appId: com.yazarkasa.app
productName: YazarKasa
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asarUnpack:
  - resources/**
npmRebuild: true

# Otomatik güncelleme: GitHub Releases.
# owner/repo belirtilmediği için electron-builder, git origin remote'undan çeker
# (GitHub Actions'ta checkout otomatik ayarlar). Repo public olmalı ki
# kurulu uygulamalar yeni sürümü token'sız indirebilsin.
publish:
  provider: github

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
portable:
  artifactName: ${productName}-portable-${version}-${arch}.${ext}
mac:
  target:
    - dmg
    - zip
  category: public.app-category.business
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
  category: Office
  artifactName: ${productName}-${version}-${arch}.${ext}